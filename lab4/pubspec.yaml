name: travel_mn
description: "Монгол орны аяллын газрууд — Лабораторийн ажил №4."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  go_router: ^18.1.4
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/PHOTO_CREDITS.txt
    - assets/fonts/LICENSE.txt
  fonts:
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700
